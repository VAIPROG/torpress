ServerTokens Prod
ServerName localhost
ServerSignature Off
TraceEnable Off
HostnameLookups Off
Protocols http/1.1
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"

<Directory "/usr/src/wordpress">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.php
    <FilesMatch "(?i)^(?:\.|wp-config\.php$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/usr/src/wordpress/wp-content/uploads">
    Options -ExecCGI -FollowSymLinks -Indexes
    AllowOverride None
    FallbackResource disabled
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

# Provision through WP-CLI before enabling the onion service.
<LocationMatch "^/wp-admin/(?:install|setup-config)\.php(?:/|$)">
    Require all denied
</LocationMatch>

# This deployment does not use the public XML-RPC or pingback endpoints.
<LocationMatch "^/xmlrpc\.php(?:/|$)">
    Require all denied
</LocationMatch>
